# GitHub App Manifest — used when registering the app at
# https://github.com/settings/apps/new  (or via /probot setup)

name: check-reviewer-no-commit
description: Ensures that no committer on a pull request can also approve it.
url: https://github.com/Depthmark/check-reviewer-no-commit

# Webhook events the app subscribes to
default_events:
  - check_run
  - check_suite
  - pull_request
  - pull_request_review

# Permissions required
default_permissions:
  checks: write
  contents: read
  pull_requests: read
  metadata: read

# Can be installed on any account
public: true
