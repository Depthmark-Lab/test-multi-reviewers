suite: service
templates:
  - templates/service.yaml
tests:
  - it: should render a Service
    asserts:
      - isKind:
          of: Service

  - it: should use ClusterIP by default
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should expose port 3000
    asserts:
      - contains:
          path: spec.ports
          content:
            port: 3000
            targetPort: http
            protocol: TCP
            name: http

  - it: should match selector labels
    asserts:
      - isNotEmpty:
          path: spec.selector
