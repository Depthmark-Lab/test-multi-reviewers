suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: should render a Secret when existingSecret is not set
    set:
      app.appId: "12345"
      app.webhookSecret: "mysecret"
      app.privateKey: "mypem"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.APP_ID
          value: "12345"
      - equal:
          path: stringData.WEBHOOK_SECRET
          value: "mysecret"
      - equal:
          path: stringData.PRIVATE_KEY
          value: "mypem"

  - it: should NOT render a Secret when existingSecret is set
    set:
      app.existingSecret: my-external-secret
    asserts:
      - hasDocuments:
          count: 0
