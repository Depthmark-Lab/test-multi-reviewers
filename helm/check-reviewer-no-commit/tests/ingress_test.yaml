suite: ingress
templates:
  - templates/ingress.yaml
tests:
  - it: should NOT render Ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Ingress when enabled
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: app.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: app.example.com

  - it: should set ingressClassName when provided
    set:
      ingress.enabled: true
      ingress.className: nginx
      ingress.hosts:
        - host: app.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should configure TLS when provided
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: app.example.com
          paths:
            - path: /
              pathType: Prefix
      ingress.tls:
        - secretName: app-tls
          hosts:
            - app.example.com
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: app-tls
