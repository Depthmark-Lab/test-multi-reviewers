apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "check-reviewer-no-commit.fullname" . }}-test-connection"
  labels:
    {{- include "check-reviewer-no-commit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args:
        - "--no-verbose"
        - "--spider"
        - "http://{{ include "check-reviewer-no-commit.fullname" . }}:{{ .Values.service.port }}/probot"
