name: Review Integrity Check

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read
  contents: read

jobs:
  review-integrity:
    name: Review Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Review integrity check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No pull_request in payload');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;

            // Get committers
            const committers = new Set();
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number, per_page: 100,
            });
            for (const commit of commits) {
              if (commit.author?.login) committers.add(commit.author.login);
              if (commit.committer?.login && commit.committer.login !== 'web-flow') {
                committers.add(commit.committer.login);
              }
            }

            // Get approvals (later reviews override earlier ones per user)
            const approvals = new Map();
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number, per_page: 100,
            });
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login) continue;
              if (review.state === 'APPROVED') {
                approvals.set(login, 'APPROVED');
              } else if (review.state === 'DISMISSED' || review.state === 'CHANGES_REQUESTED') {
                approvals.delete(login);
              }
            }

            // Check for violations: approvers who are also committers
            const violators = [...approvals.keys()].filter(u => committers.has(u));

            if (violators.length > 0) {
              core.setFailed(
                `Blocked: ${violators.length} approval(s) from committers — ${violators.map(u => `@${u}`).join(', ')}. ` +
                'A PR must be approved by someone who has not committed to the branch.'
              );
            } else {
              const msg = approvals.size > 0
                ? `Passed: ${approvals.size} valid approval(s) from non-committers`
                : 'Passed: awaiting review from a non-committer';
              core.info(msg);
            }
